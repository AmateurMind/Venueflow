steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "--tag=gcr.io/$PROJECT_ID/venueflow:$COMMIT_SHA"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=$_FIREBASE_API_KEY"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_FIREBASE_AUTH_DOMAIN"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$_FIREBASE_STORAGE_BUCKET"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$_FIREBASE_MESSAGING_SENDER_ID"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=$_FIREBASE_APP_ID"
      - "--build-arg=NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$_GOOGLE_MAPS_KEY"
      - "."

  # Step 2: Push to Google Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "gcr.io/$PROJECT_ID/venueflow:$COMMIT_SHA"

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - run
      - deploy
      - venueflow
      - "--image=gcr.io/$PROJECT_ID/venueflow:$COMMIT_SHA"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--set-env-vars=NODE_ENV=production"

images:
  - "gcr.io/$PROJECT_ID/venueflow:$COMMIT_SHA"

# Substitution variables — set these in Cloud Build triggers
substitutions:
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_PROJECT_ID: ""
  _FIREBASE_STORAGE_BUCKET: ""
  _FIREBASE_MESSAGING_SENDER_ID: ""
  _FIREBASE_APP_ID: ""
  _GOOGLE_MAPS_KEY: ""
